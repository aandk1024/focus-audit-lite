[plugin]

name="Focus Audit Lite"
description="Keyboard and gamepad navigation audit for Godot 4 (free Lite version). Builds the real focus graph of the scene you have open and reports the controls a D-pad can never reach, the places focus gets stuck, a screen that opens with nothing focused, and focus_neighbor paths that lead nowhere. The full version adds checking every scene at once and Markdown/JSON reports."
author="Idle Hands"
version="0.1.1-lite"
script="plugin.gd"
